name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build complete official Harness runtime
        run: ./scripts/build-runtime.sh

      - name: Assemble app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          cd glass && ./assemble.sh

      - name: Verify signature
        run: |
          codesign -v "glass/dist/DeepSeek Harness.app"
          test -z "$(find 'glass/dist/DeepSeek Harness.app' -type l)" \
            && echo "no symlinks (dmg-safe)" || { echo "symlinks present"; exit 1; }

      - name: Make DMG
        run: |
          mkdir -p dmg-stage
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "DeepSeek Harness Glass Sync" -srcfolder dmg-stage \
            -ov -format UDZO "DeepSeek Harness Glass Sync-${GITHUB_REF_NAME}.dmg"
          rm -rf dmg-stage

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "DeepSeek Harness Glass Sync-*.dmg"
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows x64 app
        shell: pwsh
        run: .\windows\package.ps1 -Architecture x64

      - name: Smoke test published Windows shell
        shell: pwsh
        run: |
          $app = Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64\DeepSeekHarnessGlass.exe"
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              Write-Output "Windows shell exited during startup with code $($process.ExitCode)"
              if (Test-Path "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log") {
                Get-Content "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log" -Tail 120
              }
              exit 1
            }
            Write-Output "published Windows shell stayed alive for startup smoke test"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes

      - name: Create Windows NSIS Setup
        shell: pwsh
        run: |
          .\windows\build-installer.ps1 -Architecture x64 -Version $env:GITHUB_REF_NAME

      - name: Smoke test Windows NSIS Setup install, launch, and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64-Setup-$env:GITHUB_REF_NAME.exe").Path
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\DeepSeek Harness Glass"
          $uninstaller = Join-Path $installRoot "Uninstall DeepSeek Harness Glass.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\DeepSeek Harness Glass\DeepSeek Harness Glass.lnk"
          $dshSmokeRoot = Join-Path $env:USERPROFILE ".dsh\glass-nsis-smoke-$env:GITHUB_RUN_ID"
          $dshSmokeFile = Join-Path $dshSmokeRoot "sentinel.txt"

          function Invoke-SetupSmoke {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][string]$Stage
            )

            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "NSIS Setup $Stage exceeded the 10-minute smoke-test limit."
            }
            if ($process.ExitCode -ne 0) {
              throw "NSIS Setup $Stage failed with exit code $($process.ExitCode)."
            }
          }

          Get-Process -Name 'DeepSeekHarnessGlass' -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $dshSmokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dshSmokeRoot | Out-Null
          Set-Content -LiteralPath $dshSmokeFile -Value "preserve user DSH_HOME"

          try {
            Invoke-SetupSmoke -Stage "install" -FilePath $setup -Arguments @("/S")

            $installedApp = Join-Path $installRoot "DeepSeekHarnessGlass.exe"
            if (-not (Test-Path $installedApp)) {
              throw "NSIS Setup did not place the Windows executable."
            }
            if (-not (Test-Path $shortcut)) {
              throw "NSIS Setup did not create the Start Menu shortcut."
            }

            $appProcess = Start-Process -FilePath $installedApp -WorkingDirectory $installRoot -PassThru
            try {
              Start-Sleep -Seconds 12
              if ($appProcess.HasExited) {
                throw "Installed NSIS application exited during startup with code $($appProcess.ExitCode)."
              }
            }
            finally {
              if (-not $appProcess.HasExited) {
                Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
              }
            }

            if (-not (Test-Path $uninstaller)) {
              throw "NSIS Setup did not create the uninstaller."
            }
            Invoke-SetupSmoke -Stage "uninstall" -FilePath $uninstaller -Arguments @("/S")

            if (-not (Test-Path $dshSmokeFile)) {
              throw "NSIS uninstall removed user DSH_HOME data."
            }
            if (Test-Path $installedApp) {
              throw "NSIS uninstall left the application executable behind."
            }
          }
          finally {
            Remove-Item -LiteralPath $dshSmokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "windows\dist\DeepSeekHarnessGlass-win-x64\*" `
            -DestinationPath "DeepSeekHarnessGlass-win-x64-${env:GITHUB_REF_NAME}.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "DeepSeekHarnessGlass-win-x64-*.zip"
          if-no-files-found: error

      - name: Upload Windows NSIS Setup release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: "windows/dist/DeepSeekHarnessGlass-win-x64-Setup-v*.exe"
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          generate_release_notes: true
