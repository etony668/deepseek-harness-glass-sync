name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build complete official Harness runtime
        run: ./scripts/build-runtime.sh

      - name: Assemble app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          cd glass && ./assemble.sh

      - name: Verify signature
        run: |
          codesign -v "glass/dist/DeepSeek Harness.app"
          test -z "$(find 'glass/dist/DeepSeek Harness.app' -type l)" \
            && echo "no symlinks (dmg-safe)" || { echo "symlinks present"; exit 1; }

      - name: Make DMG
        run: |
          mkdir -p dmg-stage
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "DeepSeek Harness Glass Sync" -srcfolder dmg-stage \
            -ov -format UDZO "DeepSeek Harness Glass Sync-${GITHUB_REF_NAME}.dmg"
          rm -rf dmg-stage

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "DeepSeek Harness Glass Sync-*.dmg"
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows x64 app
        shell: pwsh
        run: .\windows\package.ps1 -Architecture x64

      - name: Smoke test published Windows shell
        shell: pwsh
        run: |
          $app = Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64\DeepSeekHarnessGlass.exe"
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              Write-Output "Windows shell exited during startup with code $($process.ExitCode)"
              if (Test-Path "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log") {
                Get-Content "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log" -Tail 120
              }
              exit 1
            }
            Write-Output "published Windows shell stayed alive for startup smoke test"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          # WiX v6 keeps the v4 authoring format used by Product.wxs without
          # requiring an interactive v7 OSMF EULA acceptance in CI.
          dotnet tool install --global wix --version 6.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Create and validate Windows MSI
        shell: pwsh
        run: |
          .\windows\build-installer.ps1 -Architecture x64 -Version $env:GITHUB_REF_NAME
          wix msi validate "windows\dist\DeepSeekHarnessGlass-win-x64-$env:GITHUB_REF_NAME.msi"

      - name: Smoke test Windows MSI install, launch, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64-$env:GITHUB_REF_NAME.msi").Path
          $installRoot = Join-Path $env:RUNNER_TEMP "DeepSeekHarnessGlassMsi"
          $installLog = Join-Path $env:RUNNER_TEMP "DeepSeekHarnessGlass-msi-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "DeepSeekHarnessGlass-msi-uninstall.log"
          $dshSmokeRoot = Join-Path $env:USERPROFILE ".dsh\glass-msi-smoke-$env:GITHUB_RUN_ID"
          $dshSmokeFile = Join-Path $dshSmokeRoot "sentinel.txt"

          function Invoke-MsiSmoke {
            param(
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][string]$LogPath,
              [Parameter(Mandatory = $true)][string]$Stage
            )

            Remove-Item -LiteralPath $LogPath -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath msiexec.exe -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit(600000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 240
              }
              throw "MSI $Stage exceeded the 10-minute smoke-test limit. See the retained MSI log above."
            }
            if ($process.ExitCode -notin @(0, 3010)) {
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 240
              }
              throw "MSI $Stage failed with exit code $($process.ExitCode). See the retained MSI log above."
            }
          }

          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $dshSmokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dshSmokeRoot | Out-Null
          Set-Content -LiteralPath $dshSmokeFile -Value "preserve user DSH_HOME"

          try {
            Invoke-MsiSmoke -Stage "install" -LogPath $installLog -Arguments @(
              "/i", $msi, "/qn", "/norestart", "/L*V", $installLog,
              "INSTALLFOLDER=$installRoot"
            )

            $installedApp = Join-Path $installRoot "DeepSeekHarnessGlass.exe"
            if (-not (Test-Path $installedApp)) {
              throw "MSI install did not place the Windows executable."
            }

            $appProcess = Start-Process -FilePath $installedApp -WorkingDirectory $installRoot -PassThru
            try {
              Start-Sleep -Seconds 12
              if ($appProcess.HasExited) {
                throw "Installed MSI application exited during startup with code $($appProcess.ExitCode)."
              }
            }
            finally {
              if (-not $appProcess.HasExited) {
                Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
              }
            }

            Invoke-MsiSmoke -Stage "uninstall" -LogPath $uninstallLog -Arguments @(
              "/x", $msi, "/qn", "/norestart", "/L*V", $uninstallLog
            )

            if (-not (Test-Path $dshSmokeFile)) {
              throw "MSI uninstall removed user DSH_HOME data."
            }
          }
          finally {
            Remove-Item -LiteralPath $dshSmokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload MSI smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-smoke-logs
          path: |
            ${{ runner.temp }}/DeepSeekHarnessGlass-msi-install.log
            ${{ runner.temp }}/DeepSeekHarnessGlass-msi-uninstall.log
          if-no-files-found: warn

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "windows\dist\DeepSeekHarnessGlass-win-x64\*" `
            -DestinationPath "DeepSeekHarnessGlass-win-x64-${env:GITHUB_REF_NAME}.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "DeepSeekHarnessGlass-win-x64-*.zip"
          if-no-files-found: error

      - name: Upload Windows MSI release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: "windows/dist/DeepSeekHarnessGlass-win-x64-*.msi"
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          generate_release_notes: true
