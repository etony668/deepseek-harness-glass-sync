name: windows-build

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "scripts/**"
      - "glass/runtime/**"
      - "upstream/deepseek-harness"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "windows/**"
      - "scripts/**"
      - "glass/runtime/**"
      - "upstream/deepseek-harness"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows x64 app and official runtime
        shell: pwsh
        run: .\windows\package.ps1 -Architecture x64

      - name: Smoke test published Windows shell
        shell: pwsh
        run: |
          $app = Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64\DeepSeekHarnessGlass.exe"
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru
          try {
            Start-Sleep -Seconds 12
            if ($process.HasExited) {
              Write-Output "Windows shell exited during startup with code $($process.ExitCode)"
              if (Test-Path "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log") {
                Get-Content "$env:LOCALAPPDATA\DeepSeek Harness Glass\startup.log" -Tail 120
              }
              exit 1
            }
            Write-Output "published Windows shell stayed alive for startup smoke test"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g WixToolset.UI.wixext/7.0.0

      - name: Create and validate Windows MSI
        shell: pwsh
        run: |
          .\windows\build-installer.ps1 -Architecture x64 -Version 0.0.1
          wix msi validate "windows\dist\DeepSeekHarnessGlass-win-x64-v0.0.1.msi"

      - name: Smoke test Windows MSI install and uninstall
        shell: pwsh
        run: |
          $msi = Resolve-Path "windows\dist\DeepSeekHarnessGlass-win-x64-v0.0.1.msi"
          $installRoot = Join-Path $env:RUNNER_TEMP "DeepSeek Harness Glass MSI"
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath msiexec.exe -ArgumentList @(
            "/i", $msi, "/qn", "/norestart", "INSTALLFOLDER=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "MSI install failed with exit code $($install.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $installRoot "DeepSeekHarnessGlass.exe"))) {
            throw "MSI install did not place the Windows executable."
          }
          $uninstall = Start-Process -FilePath msiexec.exe -ArgumentList @(
            "/x", $msi, "/qn", "/norestart"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)."
          }

      - name: Print Windows runtime diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Output "== dsh smoke stdout =="
          if (Test-Path windows\build\dsh-smoke.log) {
            Get-Content windows\build\dsh-smoke.log -Tail 150
          }
          Write-Output "== dsh smoke stderr =="
          if (Test-Path windows\build\dsh-smoke.log.err) {
            Get-Content windows\build\dsh-smoke.log.err -Tail 150
          }

      - name: Upload unpackaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessGlass-win-x64
          path: windows/dist/DeepSeekHarnessGlass-win-x64
          if-no-files-found: error

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessGlass-win-x64-msi
          path: windows/dist/DeepSeekHarnessGlass-win-x64-v0.0.1.msi
          if-no-files-found: error
